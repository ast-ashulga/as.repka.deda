# repka configuration (tracked). Every key is optional; the values below are the defaults.
# Unknown keys and wrong types are rejected at startup. Every boolean defaults to false.
# Secrets never go here: see .env.example.

github:
  search_per_minute: 25        # client throttle for search endpoints (GitHub max 30)
  per_page: 100
  timeout_s: 30

collect:
  first_window: 90d            # backfill window on a domain's first scan (pushed:>=); first scan is a silent baseline
  overlap: 1d                  # incremental scans use pushed:>= last_scan - overlap
  max_repos_per_domain_scan: 3000
  enrich_batch: 50             # GraphQL nodes per query
  slow_metrics_every: 7d       # contributors + participation refresh period
  accepted_refresh_every: 20h  # accepted repos not matched by the search are re-snapshotted at most this often (0s = every scan)

triage:
  enabled: true                # run decider triage during `repka run`
  model: d1-3B                 # name in deciders/models.yaml
  deciders_dir: deciders
  timeout_s: 1800
  online: false                # allow HF downloads inside workers
  allow_remote: false          # permit remote decider backends (e.g. hosted Jev); never default
  readme_chars: 4000
  thresholds: {relevant: 0.76, substance: 2}

embed:
  enabled: true                # compute embeddings during `repka run`
  backend: ollama
  model: nomic-embed-text
  url: http://localhost:11434
  batch: 32

digest:
  slots: ["09:00"]           # local time
  max_lateness: 6h             # a slot older than this is skipped, not sent late
  max_items_per_domain: 10
  new_max_age: 90d             # a first-seen repo created within this age is "new", older ones are "found"
  star_spike_min_delta: 50     # stars_delta_1d threshold for the "top movers" digest section
  insights: false              # digest insights section; enable together with releases_message
  releases_message: true       # separate releases message at releases_slot
  releases_slot: "09:00"       # local time HH:MM for the releases message
  facet_min_p: 0.7             # minimum probability (0 < p <= 1) for an insight facet to be shown
  pending_max_age: 7d          # a pending insight expires after this age

notify:
  enabled: true               # Telegram delivery; off by default
  backend: telegram_user       # own account via fast-mcp-telegram
  chat_id: "me"                # "me" = Saved Messages; or numeric id / @username
  topic_id: null

run:
  send: true                  # second switch: digests are sent only if notify.enabled AND run.send (or --send)
  log_level: INFO              # DEBUG, INFO, WARNING or ERROR
  progress: live               # stderr while `repka run` works: plain | live | lines | jsonl (live without a terminal acts as lines)
