id: ai-agent-harness
name: "AI Agent Harness"
enabled: true
scan_every: 20h
profile: |
  Agent harnesses: the runtime and scaffolding around an LLM agent that runs the
  tool loop, manages context and memory, sandboxes execution, enforces permissions,
  orchestrates sub-agents and evaluates agent runs. Included: coding-agent
  harnesses and CLIs, plugin/skill/hook systems for harnesses, self-improving or
  recursively self-improving harnesses (agents that evolve their own prompts, tools
  or code against a measurable goal), long-horizon agent control planes, and
  agent eval harnesses.
  Excluded: plain LLM SDKs or API wrappers, general chat UIs, awesome-lists,
  tutorials, courses and prompt collections without runnable code, skill packs
  that only contain prompts, and forks without changes.
  Match example: a Rust or TypeScript agent harness with a plugin system and a
  sandboxed tool loop; a framework where an agent rewrites its own harness and
  keeps changes that improve a benchmark. Miss example: a list of "awesome
  agents"; a course on building agents from scratch.
search:
  keywords:
    - ["agent harness", "coding agent harness"]
    - ["self-improving harness", "recursive self-improvement"]
  topics: [agent-harness, agentic-harness, harness-engineering, deepseek-harness, self-improving, self-improving-agents, recursive-self-improvement]
  languages: [Python, TypeScript, Rust, Go]
  exclude: ["awesome"]
  min_stars: 30
  in: [name, description, readme]
  fork_policy: exclude
key_files: [pyproject.toml, package.json, Cargo.toml, go.mod]
triage:
  # Facet questions: they describe how a repo differs inside the domain; thresholds ignore them.
  questions:
    self_modifies:
      type: noul
      instructions: >-
        Does the agent or harness modify its own code, prompts or tools in order to improve itself?
    uses_own_models:
      type: noul
      instructions: >-
        Does the project run its own AI models (judge, critic, router, memory or planner) to provide features of the harness itself?
    trains_weights:
      type: noul
      instructions: >-
        Does the project change or train model weights (fine-tuning, reinforcement learning, distillation) from agent runs?
    sandbox:
      type: noul
      instructions: >-
        Does the harness run agent-generated code or commands in an isolated sandbox (container, VM or similar)?
    subagents:
      type: noul
      instructions: >-
        Does the harness orchestrate several agents or sub-agents, including running them in parallel?
