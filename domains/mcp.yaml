id: mcp
name: "MCP servers & tooling "
enabled: true
scan_every: 12h
profile: |
  Model Context Protocol (MCP) servers, clients, SDKs and gateways: code that
  exposes tools, resources or prompts to LLM applications over MCP, or that
  consumes MCP servers. Included: reference and community MCP servers, MCP SDKs
  in any language, MCP inspectors and test harnesses, and proxies or gateways
  that aggregate several MCP servers.
  Excluded: general LLM SDKs or agent frameworks that only mention MCP in a
  feature list, awesome-lists, tutorials and course notes without code, and
  forks of official servers with no changes.
  Examples of a match: a TypeScript server that exposes a GitHub API as MCP
  tools; a Python SDK for building MCP clients. Examples of a miss: a blog post
  about MCP; a Minecraft mod that happens to be called "mcp".
search:
  keywords:
    - ["model context protocol", "mcp server"]
    - ["mcp client", "mcp sdk"]
  topics: [mcp, model-context-protocol]
  languages: [Python, TypeScript, Go, Rust]
  exclude: ["minecraft"]
  min_stars: 200
  in: [name, description, readme]
  fork_policy: exclude
key_files: [pyproject.toml, package.json, Cargo.toml, go.mod]
triage:
  # Facet questions: they describe how a repo differs inside the domain; thresholds ignore them.
  questions:
    remote_transport:
      type: noul
      instructions: >-
        Can the server or client work over the network (HTTP, SSE or streamable HTTP), not only over stdio?
    gateway:
      type: noul
      instructions: >-
        Does the project aggregate, proxy or route requests to several MCP servers?
    guardrails:
      type: noul
      instructions: >-
        Does the project add security controls to tool calls (permissions, approval, filtering, auditing or sandboxing)?
    token_efficiency:
      type: noul
      instructions: >-
        Does the project reduce the context or token cost of tool definitions (lazy loading, tool search, code execution instead of tool calls)?
    wraps_service:
      type: noul
      instructions: >-
        Does the server wrap one specific external product or API (a SaaS, database or developer service) rather than being general purpose?
