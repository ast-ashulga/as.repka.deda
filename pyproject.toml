[project]
name = "repka"
version = "0.1.0"
description = "Local monitoring, triage and Telegram digests for GitHub repositories"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "numpy>=1.26",
]

[project.scripts]
repka = "repka.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repka"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs network/models; run with REPKA_LIVE=1"]

[tool.ruff.lint]
select = ["F"]
