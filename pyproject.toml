[project]
name = "repka"
version = "0.1.0"
description = "Local monitoring, triage and Telegram digests for GitHub repositories"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "ast-ashulga" }]
keywords = ["github", "monitoring", "telegram", "digest", "local-first", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "sqlite-vec==0.1.9",
    "mcp>=1.25",
    "fast-mcp-telegram>=0.46,<0.47",
]

[project.urls]
Homepage = "https://github.com/ast-ashulga/as.repka.deda"
Issues = "https://github.com/ast-ashulga/as.repka.deda/issues"

[project.scripts]
repka = "repka.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repka"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pytest-asyncio>=0.24",
]
# Phase 2 dashboard (ADR-008). Not installed by plain `uv sync` (the daemon env stays small):
# `uv sync --group dashboard`. Tests that need pandas/streamlit use pytest.importorskip.
dashboard = [
    "streamlit>=1.40",
    "plotly>=5.24",
    "pandas>=2.2",
    "umap-learn>=0.5.7",
    "scikit-learn>=1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = ["live: needs network/models; run with REPKA_LIVE=1"]

[tool.ruff.lint]
# Not enabled: SIM, E501 (line length), UP047 (PEP 695 generics).
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "B905", "E731"]
ignore = ["UP047"]
