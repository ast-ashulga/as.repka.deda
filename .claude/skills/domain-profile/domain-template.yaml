id: <domain-id>                # slug: 2-40 chars of a-z, 0-9, '-'; must equal the file name
name: "<Human-readable domain name>"
enabled: false                 # leave false unless the user explicitly asks to enable
scan_every: 12h                # at least 1h
profile: |
  <What is in scope, what is out of scope, and one example of a match and one of a miss.
  Plain text for the deciders, at most 1,500 characters.>
search:
  keywords:                    # each group becomes its own query; words inside a group are ORed
    - ["<phrase one>", "<phrase two>"]
  topics: [<github-topic>]     # topic:<t> queries; [] if none
  languages: [Python, TypeScript]   # [] = any language
  exclude: []                  # each word becomes NOT <word>; at most 5 operators per query
  min_stars: 5
  in: [name, description, readme]
  fork_policy: exclude         # exclude | include | only
key_files: [pyproject.toml, package.json]
triage:
  questions: {}
